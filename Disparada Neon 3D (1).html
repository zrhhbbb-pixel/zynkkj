function update(dt){
  if(st==='paused')return;
  if(st==='playing'){
    speed=5+19*(1-Math.exp(-runTime/S.acc));var nl=Math.floor((speed-5)/3)+1;if(nl>lvl){lvl=nl;toast('Nível '+nl+': mais rápido!');beep(700,.15,'triangle')}
    dist+=speed*dt;since+=speed*dt;runTime+=dt;if(!swStop)swTime+=dt;
    if(since>=gap)spawn();
    var i;
    for(i=obs.length-1;i>=0;i--){
      var o=obs[i];o.d-=(speed+(o.v||0))*dt;
      if(o.d+o.len<-9){rm(obs.splice(i,1)[0]);continue}
      if(o.d<1.45&&o.d+o.len>1.05&&Math.abs(px-o.l)<0.6){
        if(o.type==='block'||o.type==='train'||(o.type==='crate'&&jy<0.75)||(o.type==='low'&&jy<0.4)||(o.type==='high'&&slide<=0&&jy<0.78)){die();break}
      }
    }
    for(i=coins.length-1;i>=0;i--){
      var c=coins[i];c.d-=speed*dt;
      if(c.d<-9){rm(coins.splice(i,1)[0]);continue}
      if(st==='playing'&&c.d<1.5&&c.d>0.95&&Math.abs(px-c.l)<0.55&&jy<0.6){
        runCoins++;S.coins++;if(S.nc&&!swStop){swStop=true;sw.style.color='#ff5a5a';toast('Pegou moeda! Cronômetro parou');beep(300,.2,'square',.05)}cnEl.textContent=runCoins;beep(880+(runCoins%5)*110,.07,'triangle',.06);
        
        rm(coins.splice(i,1)[0]);

  px+=(lane-px)*Math.min(1,dt*13);
  var tf=(S.dyn&&st==='playing')?S.fov+(speed-5)*0.8:S.fov;fovE+=(tf-fovE)*Math.min(1,dt*3);
  if(st!=='over')phase+=dt*(6+speed*1.1);
  if(jy>0||vy>0){vy-=18*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0;if(queued){slide=0.5;queued=false}}}
  if(slide>0)slide-=dt;
  if(shake>0)shake-=dt;
  for(var q=parts.length-1;q>=0;q--){var a=parts[q];a.t-=dt;a.vy+=400*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.t<=0)parts.splice(q,1)}
}

var GB={db:null,uid:null,rows:[],ready:false,err:'',msg:'',canWrite:true,busy:false};
function gbRender(){if(document.activeElement&&document.activeElement.id==='nick')return;if(tab==='top'&&!menu.classList.contains('off'))renderPane()}
function gbInit(){
  if(!window.claude||!claude.use){GB.err='Ranking indisponível neste modo.';return}
  var to=setTimeout(function(){if(!GB.ready){GB.err='Não foi possível alcançar o ranking agora.';gbRender()}},10000);
  claude.use('db').then(function(d){
    if(!d){clearTimeout(to);GB.err='Ranking indisponível. Entre na sua conta para ver o top global.';gbRender();return}
    GB.db=d;
    return claude.use('user').then(function(u){
      if(!u)return;
      return u.id().then(function(id){GB.uid=id;return u.can('data.write')}).then(function(cw){if(cw===false)GB.canWrite=false})
    }).then(function(){
      d.collection('top').orderBy('best','desc').limit(30).onSnapshot(function(snap){
        clearTimeout(to);GB.ready=true;GB.err='';GB.rows=[];
        snap.docs.forEach(function(x){var r=x.data()||{};if(typeof r.best==='number'){r.id=x.id;GB.rows.push(r)}});
        gbRender()
      },function(e){clearTimeout(to);GB.err='Erro ao carregar o ranking ('+e.code+').';gbRender()})
    })
  }).catch(function(){clearTimeout(to);GB.err='Ranking indisponível.';gbRender()})
}
function gbSubmit(t,d,manual){
  if(!GB.db||!GB.uid){if(manual){GB.msg='Entre na sua conta para enviar seu tempo.';gbRender()}return}
  if(!GB.canWrite){if(manual){GB.msg='Seu acesso é só de leitura: peça acesso de colaborador para enviar tempos.';gbRender()}return}
  if(!(t>0)||GB.busy)return;
  GB.busy=true;var ref=GB.db.doc('top/'+GB.uid);
  ref.get().then(function(sn){
    var dd=sn.exists?sn.data():null,cur=dd&&typeof dd.best==='number'?dd.best:0;
    if(t<=cur+0.005){if(manual)GB.msg='Seu tempo no ranking já é melhor ou igual.';return}
    return ref.set({name:(S.nick||'Jogador').slice(0,16),best:Math.round(t*100)/100,dist:d||0,skin:SK[S.skin].n,ts:Date.now()}).then(function(){GB.msg='Tempo enviado ao top global: '+fmt(t)})
  }).catch(function(e){GB.msg='Não foi possível enviar ('+((e&&e.code)||'erro')+').'}).then(function(){GB.busy=false;gbRender()})
}
function gbNick(){
  S.nick=(S.nick||'').trim().slice(0,16);save();
  if(GB.db&&GB.uid&&GB.canWrite){var ref=GB.db.doc('top/'+GB.uid);
    ref.get().then(function(sn){if(sn.exists)return ref.update({name:S.nick||'Jogador'})}).then(function(){GB.msg='Apelido salvo.';gbRender()}).catch(function(){GB.msg='Apelido salvo só neste aparelho.';gbRender()})
  }else{GB.msg='Apelido salvo neste aparelho.';gbRender()}
}
function applySw(){
  var c=['#5cf06b','#26e6ff','#ffffff','#ffd23f','#ff3d9a'][S.swc||0];sw.style.setProperty('--swc',c);
  if(S.swImg){sw.style.backgroundImage='url("'+S.swImg+'")';sw.style.backgroundPosition='center '+S.swy+'%';sw.style.boxShadow='inset 0 0 0 400px rgba(0,0,0,'+(S.swd/100)+')'}
  else{sw.style.backgroundImage='none';sw.style.boxShadow='none'}
}
document.getElementById('swf').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,480/im.width),cw=Math.round(im.width*k),ch=Math.round(im.height*k),c=document.createElement('canvas');
    c.width=cw;c.height=ch;c.getContext('2d').drawImage(im,0,0,cw,ch);
    S.swImg=c.toDataURL('image/jpeg',.8);applySw();save();renderPane()};im.src=rd.result};
  rd.readAsDataURL(f)
});
gbInit();applySw();

/* ---------- overlays e textos para lives ---------- */
var OVD={live:0,sc:2,cnt:0,rec:0,clk:0,low:0,lowT:'',lowS:'',tick:0,tickT:'',tickV:1,frm:0,cam:0,camC:1,camS:1,camG:0,vig:0,hud:1};
var TCOL=['#ffffff','#ffd23f','#5cf06b','#26e6ff','#ff3d9a','#ff4a4a','#111111'];
var ovEl=document.getElementById('ov'),drag=null;
S.ov=Object.assign({},OVD,S.ov||{});if(!Array.isArray(S.tx))S.tx=[];S.txi=Math.min(S.txi||0,Math.max(0,S.tx.length-1));
function clock(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function renderOv(){
  var o=S.ov,h='',i,ed=ovEl.classList.contains('ov-edit'),cw=[110,150,200][o.camS]||150;
  if(o.vig)h+='<div class="ovv"></div>';
  if(o.frm)h+='<div class="ovf f'+o.frm+'"></div>';
  if(o.cam){var pos=['left:10px;top:calc(env(safe-area-inset-top,0px) + 160px)','right:10px;top:calc(env(safe-area-inset-top,0px) + 160px)','left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px)','right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px)'][o.camC]||'';
    h+='<div class="ovcam" style="'+pos+';width:'+cw+'px;height:'+Math.round(cw*.75)+'px;'+(o.camG?'background:#00ff00;':'')+'"></div>'}
  var ch='';
  if(o.live)ch+='<div class="ovchip"><i class="dot"></i>AO VIVO</div>';
  if(o.cnt)ch+='<div class="ovchip">Tentativa #'+(S.tries||0)+' &nbsp; Mortes '+(S.deaths||0)+'</div>';
  if(o.rec)ch+='<div class="ovchip">Recorde sem moeda '+fmt(S.btn||0)+'</div>';
  if(o.clk)ch+='<div class="ovchip" id="ovclk">'+clock()+'</div>';
  if(ch)h+='<div class="ovstack s'+o.sc+'">'+ch+'</div>';
  if(o.low&&(o.lowT||o.lowS))h+='<div class="ovlow'+(o.tick?' up':'')+'"><b>'+esc(o.lowT)+'</b><span>'+esc(o.lowS)+'</span></div>';
  if(o.tick&&o.tickT){var dur=((400+o.tickT.length*9)/90*(o.tickV||1)).toFixed(1);h+='<div class="ovtk"><span style="--d:'+dur+'s">'+esc(o.tickT)+'</span></div>'}
  for(i=0;i<S.tx.length;i++){var t=S.tx[i];if(!t.t&&!ed)continue;
    h+='<div class="ovt f'+t.f+(ed&&i===S.txi?' sel':'')+'" data-i="'+i+'" style="left:'+t.x+'%;top:'+t.y+'%;font-size:'+t.s+'px;color:'+TCOL[t.c]+'">'+(t.t?esc(t.t):'(vazio)')+'</div>'}
  ovEl.innerHTML=h;
  document.body.classList.toggle('nohud',!o.hud)
}
ovEl.addEventListener('pointerdown',function(e){
  var t=e.target.closest&&e.target.closest('.ovt');if(!t||!ovEl.classList.contains('ov-edit'))return;
  S.txi=+t.dataset.i;drag={i:S.txi,el:t};try{t.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()
});
ovEl.addEventListener('pointermove',function(e){
  if(!drag)return;var x=Math.max(0,Math.min(100,e.clientX/window.innerWidth*100)),y=Math.max(0,Math.min(100,e.clientY/window.innerHeight*100));
  S.tx[drag.i].x=Math.round(x);S.tx[drag.i].y=Math.round(y);drag.el.style.left=S.tx[drag.i].x+'%';drag.el.style.top=S.tx[drag.i].y+'%'
});
function endDrag(){if(drag){drag=null;save();renderOv();renderPane()}}
ovEl.addEventListener('pointerup',endDrag);ovEl.addEventListener('pointercancel',endDrag);
setInterval(function(){var c=document.getElementById('ovclk');if(c)c.textContent=clock()},1000);
renderOv();

go.addEventListener('click',act);
pz.addEventListener('click',pause);
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(st!=='playing'){if((k==='Enter'||k===' ')&&e.target===document.body&&!menu.classList.contains('off')){e.preventDefault();act()}return}
  if(k==='p'||k==='P'||k==='Escape'){pause();return}
  if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();moveL()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();moveR()}
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' '){e.preventDefault();jump()}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();down()}
});
var sx=0,sy=0,done=true;
cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;done=false});
cv.addEventListener('pointermove',function(e){
  if(done)return;var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28||Math.abs(dy)>28){done=true;if(Math.abs(dx)>Math.abs(dy)){dx>0?moveR():moveL()}else{dy<0?jump():down()}}
});
cv.addEventListener('pointerup',function(){if(!done)jump();done=true});
cv.addEventListener('pointercancel',function(){done=true});
document.addEventListener('visibilitychange',function(){if(document.hidden){pause();save()}});
})();
</script>
